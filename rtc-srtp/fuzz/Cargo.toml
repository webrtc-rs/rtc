[package]
name = "rtc-srtp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rtc-srtp]
path = ".."

[dependencies.rtc-crypto]
path = "../../rtc-crypto"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "unprotect"
path = "fuzz_targets/unprotect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
