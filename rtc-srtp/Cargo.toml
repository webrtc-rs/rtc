[package]
name = "rtc-srtp"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "RTC SRTP in Rust"
license.workspace = true
documentation = "https://docs.rs/rtc-srtp"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring"]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["marshal", "replay"] }
rtp.workspace = true
rtcp.workspace = true
crypto.workspace = true

byteorder.workspace = true
foldhash.workspace = true
bytes.workspace = true

[dev-dependencies]
serde_json.workspace = true
criterion.workspace = true
lazy_static.workspace = true

[[bench]]
name = "bench"
harness = false
