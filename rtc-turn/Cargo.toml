[package]
name = "rtc-turn"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "RTC TURN in Rust"
license.workspace = true
documentation = "https://docs.rs/rtc-turn"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["crypto-ring"]
crypto-ring = ["crypto/crypto-ring", "stun/crypto-ring"]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs", "stun/crypto-aws-lc-rs"]
metrics = []

[dependencies]
shared = { workspace = true, default-features = false, features = [] }
stun.workspace = true
sansio.workspace = true
crypto.workspace = true

bytes.workspace = true
log.workspace = true

[dev-dependencies]
env_logger.workspace = true
chrono.workspace = true
hex.workspace = true
clap.workspace = true
criterion.workspace = true
crossbeam-channel.workspace = true
ctrlc.workspace = true

[[bench]]
name = "bench"
harness = false

[[example]]
name = "turn_client_udp"
path = "examples/turn_client_udp.rs"
bench = false
