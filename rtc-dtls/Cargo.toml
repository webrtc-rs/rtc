[package]
name = "rtc-dtls"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "RTC DTLS in Rust"
license.workspace = true
documentation = "https://docs.rs/rtc-dtls"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ring"]
ring = ["crypto/ring", "rustls/ring", "rcgen/ring"]
aws-lc-rs = ["crypto/aws-lc-rs", "rustls/aws-lc-rs", "rcgen/aws_lc_rs"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["replay"] }
crypto.workspace = true

bytes.workspace = true
byteorder.workspace = true
x509-parser.workspace = true
der-parser.workspace = true
rcgen.workspace = true
rustls.workspace = true
rkyv.workspace = true
bytecheck.workspace = true
log.workspace = true
pem.workspace = true

[dev-dependencies]
criterion.workspace = true
local-sync.workspace = true
core_affinity.workspace = true
chrono.workspace = true
env_logger.workspace = true
clap.workspace = true
anyhow.workspace = true
ctrlc.workspace = true
futures.workspace = true

