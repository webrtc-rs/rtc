[package]
name = "rtc-dtls"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "RTC DTLS in Rust"
license.workspace = true
documentation = "https://docs.rs/rtc-dtls"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ring"]
ring = ["crypto/ring", "rustls/ring", "rcgen/ring"]
aws-lc-rs = ["crypto/aws-lc-rs", "rustls/aws-lc-rs", "rcgen/aws_lc_rs"]

[dependencies]
shared = { workspace = true, default-features = false, features = ["crypto", "replay"] }
crypto.workspace = true

bytes.workspace = true
byteorder.workspace = true
x509-parser = "0.16.0"
der-parser = "9.0.0"
rcgen.workspace = true
rustls = { version = "0.23.27", default-features = false, features = ["std"] }
rkyv = "0.8.17"
bytecheck = "0.8"
log.workspace = true
pem.workspace = true

[dev-dependencies]
local-sync = "0.1.1"
core_affinity = "0.8.1"
chrono.workspace = true
env_logger.workspace = true
clap.workspace = true
anyhow = "1.0.80"
ctrlc.workspace = true
futures = "0.3.30"

