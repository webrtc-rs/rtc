# aarch64 build flags.
#
# rtc's own crypto no longer needs any: `aes` 0.9 and `sha1` 0.11 detect the ARMv8 AES and SHA-1
# instructions at run time (and fall back to software on cores without them), and AES-GCM runs
# on `ring`/`aws-lc-rs`. A downstream user building rtc as a dependency gets the hardware paths
# with no configuration, which is the point: this file is not inherited by dependents.
#
# The flags below remain only because the *old* `webrtc` 0.14 crate, pulled in as a
# dev-dependency for cross-version interop tests, still uses `aes` 0.8 / `polyval` 0.6, whose
# ARMv8 backends are opt-in via `--cfg`. They keep those tests quick on Apple silicon and affect
# nothing that ships.
#
# Caveat: an exported RUSTFLAGS / CARGO_ENCODED_RUSTFLAGS env var replaces (does not merge with)
# these config rustflags. That is harmless now.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
