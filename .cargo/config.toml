# RustCrypto hardware-backend cfgs for aarch64 — needed only by *dev-only* dependencies now.
#
# rtc's own AES (SRTP AES-CM, DTLS AES-CCM / AES-CBC, SRTP key derivation, in rtc-crypto) runs on
# `aes` 0.9, which detects the ARMv8 AES instructions at runtime without any cfg. It moved there
# from `aes` 0.8, which only compiled its ARMv8 backend in when the *final build* passed
# `--cfg aes_armv8` — something applications depending on rtc never inherit from this file, since
# cargo reads `.cargo/config.toml` from the directory it runs in, not from each dependency. Such a
# build silently got the constant-time software AES: a 1,200-byte AES-128-CTR keystream took
# 5,977 ns instead of 223 ns on an M1 Max.
# `python3 scripts/bench.py external` builds a stand-in consumer from outside the repository to
# check that no acceleration depends on this file again.
#
# The AES-GCM AEAD runs on `ring` or `aws-lc-rs` and never depended on these flags.
#
# What still reads them: `aes` 0.8.4 and `polyval` 0.6.2 in the dependency tree of the `webrtc`
# 0.14 crate that the interop tests use, and `benchmarks/aead-gcm`, whose comparison assumes the
# hardware RustCrypto backends. Both autodetect the CPU features at runtime and fall back to
# software on cores without them, so enabling the flags unconditionally on aarch64 is safe. Flag
# names verified against aes-0.8.4 (src/lib.rs, `aes_armv8`) and polyval-0.6.2 (src/lib.rs,
# `polyval_armv8`).
#
# An exported RUSTFLAGS / CARGO_ENCODED_RUSTFLAGS replaces (does not merge with) these config
# rustflags. That no longer changes any rtc crate's numbers, only those of the dev dependencies
# above.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
