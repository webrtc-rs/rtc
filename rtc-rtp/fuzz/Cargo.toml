[package]
name = "rtc-rtp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rtc-rtp]
path = ".."

[dependencies.rtc-shared]
path = "../../rtc-shared"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "parse_packet"
path = "fuzz_targets/parse_packet.rs"
test = false
doc = false
bench = false

[dependencies.bytes]
version = "1"

[[bin]]
name = "depacketize"
path = "fuzz_targets/depacketize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "payload"
path = "fuzz_targets/payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_peek"
path = "fuzz_targets/header_peek.rs"
test = false
doc = false
bench = false
