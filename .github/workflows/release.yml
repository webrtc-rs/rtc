# Releasing: tag `vX.Y.Z` to publish every crate to crates.io, in dependency order.
#
# The tag runs the full platform matrix first; publishing then waits for approval on the
# `crates-io` environment (Settings -> Environments), which also holds the CARGO_REGISTRY_TOKEN
# secret. A manual run defaults to a dry run.
name: release

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: Actually publish (otherwise a dry run)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    uses: ./.github/workflows/platform.yml

  publish:
    name: ${{ (github.event_name == 'push' || inputs.publish) && 'publish' || 'dry run' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the crate version
        if: github.event_name == 'push'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="rtc"))')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match rtc version $version" >&2
            exit 1
          fi
      - name: Dry run
        run: cargo publish --workspace --dry-run
      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Publishes in dependency order and waits for each crate to appear in the index.
        run: cargo publish --workspace

  github-release:
    name: GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
